<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">CUBI AI Project Assistant</title>
<desc id="desc">Cubi, the friendly construction project assistant from the approved CUBI avatar artwork: fair face, glasses, white hard hat with the blue C cube mark, high-visibility vest and tablet. Light and dark avatar artwork adapts to the system appearance.</desc>
<style>
  .night { display: none; }
  @media (prefers-color-scheme: dark) {
    .day { display: none; }
    .night { display: inline; }
  }
</style>
<image class="day" x="0" y="0" width="256" height="256" preserveAspectRatio="xMidYMid slice" href="data:image/jpeg;base64,"/>
<image class="night" x="0" y="0" width="256" height="256" preserveAspectRatio="xMidYMid slice" href="data:image/jpeg;base64,"/>
</svg>