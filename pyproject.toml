[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-pm-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",]

[project.optional-dependencies]
test = ["pytest>=8"]
validation = ["pmcontrols>=0.2.1,<0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
