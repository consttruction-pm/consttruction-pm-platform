[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-pm-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "xlrd>=2.0,<3",
  "xlwt>=1.3,<2",
  "reportlab>=4.4,<5",
  "arabic-reshaper>=3.0,<4",
  "python-bidi>=0.6,<0.7",]

[project.optional-dependencies]
test = ["pytest>=8", "psycopg[binary]>=3.2,<4", "pypdf>=5,<7"]
validation = ["pmcontrols>=0.2.1,<0.3"]

[tool.setuptools.package-data]
construction_pm = ["assets/fonts/*.ttf", "assets/fonts/LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
