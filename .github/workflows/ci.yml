name: ConstructionPM CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: construction_pm
          POSTGRES_PASSWORD: construction_pm
          POSTGRES_DB: construction_pm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_pm -d construction_pm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install PostgreSQL 16 and encrypted-backup utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 age
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Verify PostgreSQL client major version
        run: |
          pg_dump --version
          pg_restore --version
          PG_DUMP_VERSION="$(pg_dump --version)"
          PG_RESTORE_VERSION="$(pg_restore --version)"
          PG_DUMP_MAJOR="${PG_DUMP_VERSION##* }"
          PG_DUMP_MAJOR="${PG_DUMP_MAJOR%%.*}"
          PG_RESTORE_MAJOR="${PG_RESTORE_VERSION##* }"
          PG_RESTORE_MAJOR="${PG_RESTORE_MAJOR%%.*}"
          test "$PG_DUMP_MAJOR" = "16"
          test "$PG_RESTORE_MAJOR" = "16"

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run test suite
        env:
          P6_TEST_POSTGRES_DSN: postgresql://construction_pm:construction_pm@127.0.0.1:5432/construction_pm_test
          CUBI_AI_LEARNING_MEMORY_ROLE_TESTS: "1"
          CUBI_AI_LEARNING_MEMORY_BACKUP_TESTS: "1"
        run: python -m pytest -q
