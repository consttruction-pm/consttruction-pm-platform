name: ConstructionPM Web CI

permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Assemble and validate production-shaped Pages artifact
        env:
          SITE_BASE_URL: https://cubi.example.test
        run: node scripts/assemble-pages-site.mjs "$RUNNER_TEMP/cubi-pages-site"

      - name: Preview runtime smoke test
        run: |
          node --input-type=module <<'NODE'
          import { startPreviewServer } from "./preview-server.mjs";

          const server = startPreviewServer();
          await new Promise((resolve, reject) => {
            server.once("listening", resolve);
            server.once("error", reject);
          });

          try {
            const checks = [
              ["http://127.0.0.1:4173/", "CUBI Platform"],
              ["http://127.0.0.1:4173/styles.css", "prefers-reduced-motion"],
              ["http://127.0.0.1:4173/cubi-assistant-avatar.svg", "CUBI AI Project Assistant"],
              ["http://127.0.0.1:4173/client-sync/src/scheduling-adapter.js", "SCHEDULING_CONTRACT_VERSION"],
              ["http://127.0.0.1:4173/platform/", "Project planning and controls, connected."],
              ["http://127.0.0.1:4173/solutions/", "Built around how construction projects are delivered."],
              ["http://127.0.0.1:4173/resources/", "Understand the platform. Find the right next step."],
              ["http://127.0.0.1:4173/contact/", "Get to the right CUBI destination."],
            ];

            for (const [url, expected] of checks) {
              const response = await fetch(url);
              if (!response.ok) throw new Error("HTTP " + response.status + " for " + url);
              const body = await response.text();
              if (!body.includes(expected)) {
                throw new Error("Expected " + expected + " in " + url);
              }
            }
          } finally {
            await new Promise((resolve) => server.close(resolve));
          }
          NODE

      - name: Set up Python for full-stack preview E2E
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install preview runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ../..

      - name: Browser E2E for rendered assistant avatars
        env:
          CUBI_PYTHON: python
        run: npm run test:e2e:preview
