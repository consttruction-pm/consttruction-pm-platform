name: ConstructionPM Web CI

permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Preview runtime smoke test
        run: |
          node --input-type=module <<'NODE'
          import { startPreviewServer } from "./preview-server.mjs";

          const server = startPreviewServer();
          await new Promise((resolve, reject) => {
            server.once("listening", resolve);
            server.once("error", reject);
          });

          try {
            const checks = [
              ["http://127.0.0.1:4173/", "CUBI Platform"],
              ["http://127.0.0.1:4173/styles.css", "prefers-reduced-motion"],
              ["http://127.0.0.1:4173/client-sync/src/scheduling-adapter.js", "SCHEDULING_CONTRACT_VERSION"],
            ];

            for (const [url, expected] of checks) {
              const response = await fetch(url);
              if (!response.ok) throw new Error("HTTP " + response.status + " for " + url);
              const body = await response.text();
              if (!body.includes(expected)) {
                throw new Error("Expected " + expected + " in " + url);
              }
            }
          } finally {
            await new Promise((resolve) => server.close(resolve));
          }
          NODE
