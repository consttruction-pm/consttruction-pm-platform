name: ConstructionPM Web CI

permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
