name: ConstructionPM Web CI

permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Assemble and validate production-shaped Pages artifact
        env:
          SITE_BASE_URL: https://cubi.example.test
          CUBI_WORKSPACE_URL: https://cubi-workspace-preview.example.test/preview/login
        run: node scripts/assemble-pages-site.mjs "$RUNNER_TEMP/cubi-pages-site"

      - name: Preview runtime smoke test
        run: npm run preview:smoke

      - name: Set up Python for full-stack preview E2E
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install preview runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ../..

      - name: Browser E2E for rendered assistant avatars
        env:
          CUBI_PYTHON: python
        run: npm run test:e2e:preview
