name: ConstructionPM Web CI

permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Preview runtime smoke test
        run: |
          nohup node --input-type=module -e "import(\"./preview-server.mjs\").then(({ startPreviewServer }) => startPreviewServer())" > "$RUNNER_TEMP/cubi-preview.log" 2>&1 < /dev/null &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if ! kill -0 "$preview_pid" 2>/dev/null; then cat "$RUNNER_TEMP/cubi-preview.log"; exit 1; fi
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 0.25
          done
          if ! curl -fsS http://127.0.0.1:4173/ > "$RUNNER_TEMP/cubi-homepage.html"; then cat "$RUNNER_TEMP/cubi-preview.log"; exit 1; fi
          grep -q "Construction &amp; Building" "$RUNNER_TEMP/cubi-homepage.html"
          curl -fsS "http://127.0.0.1:4173/styles.css" | grep -q "prefers-reduced-motion"
          curl -fsS "http://127.0.0.1:4173/client-sync/src/scheduling-adapter.js" | grep -q "SCHEDULING_CONTRACT_VERSION"
