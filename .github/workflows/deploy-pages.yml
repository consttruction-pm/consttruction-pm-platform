name: Deploy CUBI Web to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Assemble Pages site
        run: |
          rm -rf "${{ github.workspace }}/_site"
          mkdir -p "${{ github.workspace }}/_site/app"
          cp index.html "${{ github.workspace }}/_site/index.html"
          cp styles.css "${{ github.workspace }}/_site/styles.css"
          cp -R public/. "${{ github.workspace }}/_site/"
          cp -R dist "${{ github.workspace }}/_site/dist"
          cp index.html "${{ github.workspace }}/_site/app/index.html"
          touch "${{ github.workspace }}/_site/.nojekyll"
          # The TypeScript build writes to dist/web/src/main.js because
          # tsconfig.build.json uses rootDir=.. and outDir=dist.
          # Create correct asset paths for both the root site and /app route.
          sed -i 's#\./dist/main\.js#./dist/web/src/main.js#' "${{ github.workspace }}/_site/index.html"
          sed -i 's#\./styles\.css#./styles.css#' ../../_site/index.html
          sed -i 's#\./styles\.css#../styles.css#' "${{ github.workspace }}/_site/app/index.html"
          sed -i 's#\./dist/main\.js#../dist/web/src/main.js#' ../../_site/app/index.html
          test -f "${{ github.workspace }}/_site/index.html"
          test -f "${{ github.workspace }}/_site/app/index.html"
          test -f "${{ github.workspace }}/_site/dist/web/src/main.js"
          test -f "${{ github.workspace }}/_site/styles.css"
          test -f "${{ github.workspace }}/_site/logo.svg"
          test -f "${{ github.workspace }}/_site/.nojekyll"
          grep -q 'dist/web/src/main.js' "${{ github.workspace }}/_site/index.html"
          grep -q '../dist/web/src/main.js' "${{ github.workspace }}/_site/app/index.html"
          echo "Pages artifact ready: $(find "${{ github.workspace }}/_site" -type f | wc -l) files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ github.workspace }}/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
