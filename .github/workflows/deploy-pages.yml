name: Deploy CUBI Web to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Assemble Pages site
        run: |
          rm -rf ../../_site
          mkdir -p ../../_site/app
          cp index.html ../../_site/index.html
          cp styles.css ../../_site/styles.css
          cp -R public/. ../../_site/
          cp -R dist ../../_site/dist
          cp index.html ../../_site/app/index.html
          sed -i 's#./styles.css#../styles.css#' ../../_site/app/index.html
          sed -i 's#./dist/main.js#../dist/main.js#' ../../_site/app/index.html
          test -f ../../_site/index.html
          test -f ../../_site/app/index.html
          test -f ../../_site/dist/web/src/main.js
          test -f ../../_site/logo.svg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ../../_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
