name: Deploy CUBI Web to GitHub Pages

# Keep the published CUBI site synchronized with the main branch.

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Pages configuration is repository-level state. GITHUB_TOKEN cannot
      # create a missing Pages site; optionally provide PAGES_ADMIN_TOKEN with
      # Pages write + Administration write (or a classic repo-scoped PAT).
      - name: Verify GitHub Pages configuration
        id: pages-preflight
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN != '' }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
          if [ "$status" = "200" ]; then
            echo "enablement=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" = "404" ] && [ "$HAS_PAGES_ADMIN_TOKEN" = "true" ]; then
            echo "enablement=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" = "404" ]; then
            echo "::error title=GitHub Pages is not enabled::The repository has no readable GitHub Pages site. Enable Settings → Pages → Build and deployment → Source: GitHub Actions, or add a repository secret named PAGES_ADMIN_TOKEN with permission to create a Pages site. GITHUB_TOKEN cannot enable a missing site."
          elif [ "$status" = "403" ]; then
            echo "::error title=GitHub Pages permission denied::The workflow token cannot read Pages configuration. Enable Pages for this repository, or configure PAGES_ADMIN_TOKEN with Pages write and Administration write."
          else
            echo "::error title=GitHub Pages preflight failed::GitHub API returned HTTP $status while checking Pages configuration."
          fi
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.PAGES_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          enablement: ${{ steps.pages-preflight.outputs.enablement }}

      - name: Assemble and validate Pages site
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/assemble-pages-site.mjs "${{ github.workspace }}/_site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ github.workspace }}/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
