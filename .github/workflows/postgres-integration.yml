name: PostgreSQL Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/construction_pm/client_sync/**"
      - "tests/integration/test_postgres_*.py"
      - ".github/workflows/postgres-integration.yml"

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: construction_pm
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d construction_pm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]" psycopg[binary]>=3.2
      - name: Run live PostgreSQL integration
        env:
          CONSTRUCTION_PM_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/construction_pm
        run: python -m pytest -q tests/integration/test_postgres_*.py
