jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: construction_pm
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d construction_pm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]" "psycopg[binary]>=3.2"
      - name: Run live PostgreSQL integration
        env:
          CONSTRUCTION_PM_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/construction_pm
        run: python -m pytest -q tests/integration/test_postgres_*.py tests/integration/test_portfolio_decision_postgres_live.py tests/integration/test_dependency_graph_postgres_live.py tests/integration/test_field_operations_postgres_live.py tests/integration/test_field_assurance_templates_postgres_live.py tests/integration/test_change_claim_postgres_live.py tests/integration/test_procurement_postgres_live.py tests/integration/test_document_postgres_live.py tests/integration/test_document_search_postgres_live.py tests/integration/test_p6_field_registry_postgres_live.py tests/integration/test_p6_resource_spread_postgres_live.py tests/integration/test_p6_cost_account_postgres_live.py tests/integration/test_p6_resource_assignment_postgres_live.py tests/integration/test_p6_code_postgres_live.py tests/integration/test_p6_activity_period_actual_postgres_live.py tests/integration/test_p6_activity_step_postgres_live.py tests/integration/test_p6_activity_step_template_postgres_live.py tests/integration/test_p6_expense_postgres_live.py tests/integration/test_p6_report_profile_postgres_live.py
