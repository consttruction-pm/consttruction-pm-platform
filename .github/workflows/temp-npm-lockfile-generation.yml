name: Temporary NPM Lockfile Generation

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: apps/client-sync
            artifact: lockfile-client-sync
          - package: apps/web
            artifact: lockfile-web
          - package: apps/desktop
            artifact: lockfile-desktop
          - package: apps/mobile
            artifact: lockfile-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Generate lockfile
        working-directory: ${{ matrix.package }}
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}/package-lock.json
          if-no-files-found: error

      - name: Commit generated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ matrix.package }}/package-lock.json"
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "build: add generated npm lockfile for ${{ matrix.package }}"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
