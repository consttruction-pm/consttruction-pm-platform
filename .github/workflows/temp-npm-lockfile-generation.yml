name: Temporary NPM Lockfile Generation

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lockfiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - apps/client-sync
          - apps/web
          - apps/desktop
          - apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Generate lockfile
        working-directory: ${{ matrix.package }}
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: lockfile-${{ matrix.package }}
          path: ${{ matrix.package }}/package-lock.json
          if-no-files-found: error
