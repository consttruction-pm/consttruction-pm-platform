name: PostgreSQL Sync State Integration

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "src/construction_pm/client_sync/**"
      - "tests/integration/test_postgres_sync_state_live.py"
      - "tests/integration/test_postgres_atomic_conflict_live.py"
      - ".github/workflows/postgres-sync-state.yml"

jobs:
  postgres-sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: construction_pm
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d construction_pm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[test]" psycopg[binary]>=3.2
      - name: Run live sync-state tests
        env:
          CONSTRUCTION_PM_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/construction_pm
        run: python -m pytest -q tests/integration/test_postgres_sync_state_live.py tests/integration/test_postgres_atomic_conflict_live.py
