name: Runner Diagnostic

on:
  push:
    paths:
      - ".github/workflows/runner-diagnostic.yml"
  workflow_dispatch:

jobs:
  runner:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-slim
    runs-on: ${{ matrix.os }}
    steps:
      - name: Runner start
        run: |
          echo "runner-started:${{ matrix.os }}"
          uname -a
          python --version
