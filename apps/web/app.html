<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081A2F" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/cubi-platform-logo-primary.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The workspace must never wait on a third-party font host: scripts are
         module-deferred behind style sheets, so a stalled CDN would leave the
         authenticated shell blank. Request Vazirmatn only after the app boots. -->
    <script>
      window.addEventListener("load", function () {
        var font = document.createElement("link");
        font.rel = "stylesheet";
        font.href = "https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap";
        document.head.appendChild(font);
      });
    </script>
    <link rel="stylesheet" href="/styles.css" />
    <title>CUBI Workspace</title>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <noscript>CUBI Workspace requires JavaScript.</noscript>
    <!-- /app is already the authenticated workspace route: start it directly. -->
    <script type="module" src="/dist/main.bundle.js"></script>
    <script type="module" src="/dist/global-assistant-launcher.bundle.js"></script>
  </body>
</html>
