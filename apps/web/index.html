<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Construction PM — Web-first V1 Beta" />
    <title>Construction PM — V1 Beta</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="beta-toolbar">
      <div class="beta-toolbar__brand">Construction PM — V1 Beta</div>
      <div class="beta-toolbar__actions">
        <label for="language-selector">Language</label>
        <select id="language-selector" aria-label="Language">
          <option value="en">English</option>
          <option value="fa">فارسی</option>
          <option value="ar">العربية</option>
          <option value="he">עברית</option>
          <option value="ur">اردو</option>
          <option value="ps">پښتو</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="ja">日本語</option>
          <option value="zh">中文</option>
          <option value="ko">한국어</option>
        </select>
        <button type="button" id="calendar-gregorian">Gregorian</button>
        <button type="button" id="calendar-jalali">Jalali</button>
      </div>
    </header>
    <main>
      <div id="beta-route" class="beta-route" aria-live="polite"></div>
      <div id="beta-submenu" class="beta-submenu" aria-label="Submenu"></div>
      <div id="app"></div>
    </main>
    <script type="module" src="/dist/app.js"></script>
  </body>
</html>
