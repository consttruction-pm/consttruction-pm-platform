    <path d="M20 171 67 198 132 236 132 289 20 224Z" fill="#0748A7"/>
    <path d="M67 198 132 236 197 198 244 225 132 289 132 236Z" fill="url(#blueFront)"/>
    <path d="M67 91 132 53 132 106 88 132 88 211 67 198Z" fill="#0755B9"/>
    <path d="M132 53 174 77 174 121 132 146 132 236 88 211 88 132 132 106Z" fill="#0879EA"/>
    <path d="M174 77 197 91 197 198 155 222 155 122 174 111Z" fill="url(#tealSide)"/>
    <path d="M197 91 244 64 244 117 197 145Z" fill="#0AC5B8"/>
    <path d="M132 106 174 121 155 133 113 118Z" fill="#08BBD4"/>
  </g>
  <g>
    <text x="340" y="128" font-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="108" font-weight="800" letter-spacing="1" fill="#071A36">CUBI</text>
    <text x="344" y="192" font-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="61" font-weight="300" letter-spacing="5" fill="#071A36">Platform</text>
    <text x="347" y="237" font-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" letter-spacing="2.2" fill="#172F52">Construction &amp; Building Intelligence</text>
    <text x="347" y="287" font-family="Montserrat, Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="400" letter-spacing="2.1" fill="#172F52">Plan. Control. Build Smarter.</text>
  </g>
