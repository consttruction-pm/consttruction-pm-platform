<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">CUBI Platform — Construction &amp; Building Intelligence</title>
  <desc id="desc">CUBI Platform primary logo based on the supplied brand board: angular open cube-C symbol in blue and teal, wordmark, descriptor, and tagline.</desc>
  <defs>
    <linearGradient id="blueTop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087BFA"/><stop offset="1" stop-color="#06BDE3"/></linearGradient>
    <linearGradient id="blueSide" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07358F"/><stop offset="1" stop-color="#0757BD"/></linearGradient>
    <linearGradient id="blueFront" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0876E8"/><stop offset="1" stop-color="#0645A7"/></linearGradient>
    <linearGradient id="tealSide" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0DD6C6"/><stop offset="1" stop-color="#08AFA7"/></linearGradient>
  </defs>
  <!-- Angular open-cube C mark, following the supplied primary-logo reference -->
  <g transform="translate(35 28)">
