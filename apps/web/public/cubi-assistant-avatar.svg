<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">CUBI AI Project Assistant</title>
<desc id="desc">Front-facing, friendly ivory-faced engineering AI assistant in a white hard hat, shown from the chest up with a project schedule display and engineering details.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf7ff"/><stop offset="1" stop-color="#c6e5f5"/></linearGradient>
 <linearGradient id="helmet" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#fff"/><stop offset=".62" stop-color="#e8f0f5"/><stop offset="1" stop-color="#c5d6e2"/></linearGradient>
 <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#e6edf2"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dceaf2"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#9fb8c8"/></linearGradient>
 <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2879a9"/><stop offset="1" stop-color="#123c64"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#174366" flood-opacity=".22"/></filter>
 <style>
 @media(prefers-color-scheme:dark){#backdrop{fill:#12243d}#halo{fill:#1b4260}#orbit{stroke:#48d7e8}#spark{fill:#7ae8f0}}
 </style>
</defs>
<circle id="backdrop" cx="128" cy="128" r="126" fill="url(#bg)"/>
<circle id="halo" cx="128" cy="111" r="91" fill="#f8fdff" opacity=".78"/>
<g id="orbit" fill="none" stroke="#7eb9d4" stroke-width="1.5" opacity=".65"><path d="M20 151 Q128 211 236 151"/><path d="M34 67 Q128 22 222 67"/></g>
<g id="spark" fill="#399ac0"><path d="M36 91l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><path d="M218 91l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></g>
<g filter="url(#shadow)">
 <!-- shoulders and torso: half-body avatar -->
 <path d="M45 256c3-39 21-62 53-72h60c32 10 50 33 53 72z" fill="url(#jacket)"/>
 <path d="M96 183l32 27 32-27 12 12-15 61H99l-15-61z" fill="#f7fbfd"/>
 <path d="M114 206h28l-5 50h-18z" fill="#19a8bd"/>
 <path d="M52 241l25-35 17 12-10 38H47z" fill="url(#metal)"/>
 <path d="M204 241l-25-35-17 12 10 38h37z" fill="url(#metal)"/>
 <!-- neck -->
 <path d="M108 151h40v36c-7 12-33 12-40 0z" fill="url(#face)" stroke="#b7cbd8" stroke-width="2"/>
 <!-- head shell -->
 <rect x="58" y="63" width="140" height="117" rx="48" fill="url(#metal)" stroke="#91b0c2" stroke-width="2"/>
 <rect x="67" y="71" width="122" height="100" rx="40" fill="url(#face)" stroke="#d1e0e8" stroke-width="1.5"/>
 <!-- ear modules -->
 <rect x="48" y="105" width="18" height="40" rx="8" fill="#c9dce7" stroke="#86aabd" stroke-width="2"/>
 <rect x="190" y="105" width="18" height="40" rx="8" fill="#c9dce7" stroke="#86aabd" stroke-width="2"/>
 <circle cx="57" cy="125" r="4" fill="#25b7c8"/><circle cx="199" cy="125" r="4" fill="#25b7c8"/>
 <!-- smart, bright face -->
 <path d="M88 113q13-12 27 0" fill="none" stroke="#9aaebc" stroke-width="3" stroke-linecap="round"/>
 <path d="M141 113q13-12 27 0" fill="none" stroke="#9aaebc" stroke-width="3" stroke-linecap="round"/>
 <ellipse cx="104" cy="126" rx="10" ry="13" fill="#193f5e"/><ellipse cx="152" cy="126" rx="10" ry="13" fill="#193f5e"/>
 <ellipse cx="107" cy="122" rx="3.5" ry="4.5" fill="#fff"/><ellipse cx="155" cy="122" rx="3.5" ry="4.5" fill="#fff"/>
 <circle cx="96" cy="137" r="4" fill="#f2a7a0" opacity=".6"/><circle cx="161" cy="137" r="4" fill="#f2a7a0" opacity=".6"/>
 <path d="M111 146q17 15 34 0" fill="none" stroke="#2e8298" stroke-width="3.5" stroke-linecap="round"/>
 <!-- helmet -->
 <path d="M66 83c0-32 26-53 62-53s62 21 62 53v9H66z" fill="url(#helmet)" stroke="#9eb9c8" stroke-width="2.5"/>
 <path d="M58 84q70-17 140 0l-7 14q-63 12-126 0z" fill="#d9e8f0" stroke="#8faebe" stroke-width="2"/>
 <path d="M83 67q45-22 90 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
 <!-- simple engineering mark on helmet -->
 <path d="M119 48h18v4h-7v15h-4V52h-7z" fill="#1b91aa"/>
 <circle cx="128" cy="59" r="13" fill="none" stroke="#1b91aa" stroke-width="2" opacity=".8"/>
 <!-- project dashboard on chest -->
 <rect x="94" y="218" width="68" height="26" rx="5" fill="#0c2b49" stroke="#65dce4" stroke-width="1.5"/>
 <path d="M102 225h17v3h-17zM102 231h25v3h-25zM102 237h12v3h-12z" fill="#d9f7ff"/>
 <path d="M130 226h24v3h-24z" fill="#52d5e3"/><path d="M130 232h18v3h-18z" fill="#83b8ff"/><path d="M130 238h22v3h-22z" fill="#52d5e3"/>
 <circle cx="176" cy="211" r="10" fill="#e4fbff" stroke="#39b9c9" stroke-width="2"/><path d="m171 211 4 4 7-8" fill="none" stroke="#178b9c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>