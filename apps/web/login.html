<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081A2F" />
    <meta name="robots" content="noindex" />
    <title>CUBI Workspace — Sign in</title>
    <link rel="icon" href="/cubi-platform-logo-primary.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .cp-login-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        background:
          radial-gradient(1100px 620px at 12% -10%, #123a63 0%, transparent 60%),
          radial-gradient(900px 520px at 100% 0%, #0e4f66 0%, transparent 55%),
          #081a2f;
        color: #f4f7fb;
      }
      .cp-login-card {
        width: min(440px, 100%);
        background: #ffffff;
        color: #10233a;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 24px 64px rgba(2, 12, 24, 0.45);
      }
      .cp-login-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      .cp-login-brand img { width: 40px; height: 40px; }
      .cp-login-brand strong { font-size: 20px; letter-spacing: 0.2px; }
      .cp-login-brand span { display: block; font-size: 12px; color: #5a6b7f; }
      .cp-login-card h1 { margin: 0 0 6px; font-size: 22px; }
      .cp-login-card p.cp-login-lead { margin: 0 0 22px; color: #5a6b7f; font-size: 14px; }
      .cp-login-field { display: grid; gap: 6px; margin-bottom: 16px; }
      .cp-login-field label { font-size: 13px; font-weight: 600; }
      .cp-login-field input {
        font: inherit;
        padding: 11px 12px;
        border: 1px solid #c3ceda;
        border-radius: 8px;
        background: #fff;
        color: #10233a;
      }
      .cp-login-field input:focus-visible {
        outline: 3px solid #1f6feb;
        outline-offset: 1px;
      }
      .cp-login-submit {
        width: 100%;
        font: inherit;
        font-weight: 600;
        padding: 12px 16px;
        border: 0;
        border-radius: 8px;
        background: #1f6feb;
        color: #fff;
        cursor: pointer;
      }
      .cp-login-submit[disabled] { opacity: 0.6; cursor: progress; }
      .cp-login-error {
        margin: 0 0 16px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #fdecea;
        color: #8a1c12;
        font-size: 14px;
      }
      .cp-login-error[hidden] { display: none; }
      .cp-login-locale {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 8px;
      }
      .cp-login-locale select {
        font: inherit;
        font-size: 12px;
        background: none;
        border: 1px solid #c3ceda;
        border-radius: 999px;
        color: #5a6b7f;
        padding: 4px 12px;
        cursor: pointer;
      }
      .cp-login-footer { margin-top: 20px; font-size: 12px; color: #5a6b7f; }
      @media (max-height: 760px) {
        .cp-login-page { padding: 16px; }
        .cp-login-card { padding: 24px; }
      }
    </style>
  </head>
  <body>
    <main class="cp-login-page">
      <section class="cp-login-card" aria-labelledby="cp-login-title">
        <div class="cp-login-locale">
          <select id="cp-login-locale" aria-label="Change language">
            <option value="en">English</option>
            <option value="fa">فارسی</option>
            <option value="de">Deutsch</option>
            <option value="zh">中文</option>
            <option value="ar">العربية</option>
            <option value="fr">Français</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="ru">Русский</option>
            <option value="tr">Türkçe</option>
          </select>
        </div>
        <div class="cp-login-brand">
          <img src="/cubi-platform-logo-primary.svg" alt="" />
          <div>
            <strong>CUBI</strong>
            <span data-i18n="product">Construction planning workspace</span>
          </div>
        </div>
        <h1 id="cp-login-title" data-i18n="title">Sign in</h1>
        <p class="cp-login-lead" data-i18n="lead">Use your organization account to open the workspace.</p>
        <p class="cp-login-error" id="cp-login-error" role="alert" hidden></p>
        <form id="cp-login-form" novalidate>
          <div class="cp-login-field">
            <label for="cp-login-email" data-i18n="email">Email</label>
            <input id="cp-login-email" name="email" type="email" autocomplete="username"
                   required spellcheck="false" autocapitalize="none" />
          </div>
          <div class="cp-login-field">
            <label for="cp-login-password" data-i18n="password">Password</label>
            <input id="cp-login-password" name="password" type="password"
                   autocomplete="current-password" required />
          </div>
          <button class="cp-login-submit" id="cp-login-submit" type="submit" data-i18n="submit">
            Sign in
          </button>
        </form>
        <p class="cp-login-footer" data-i18n="footer">
          Access is limited to the projects your account is a member of.
        </p>
      </section>
    </main>

    <script type="module">
      const COPY = {

          title: "Sign in",
          lead: "Use your organization account to open the workspace.",
          email: "Email",
          password: "Password",
          submit: "Sign in",
          working: "Signing in…",

          failed: "Email or password is incorrect.",
          throttled: "Too many attempts. Wait a few minutes and try again.",
          invalid: "Enter your email and password.",
          network: "The workspace service is unreachable. Try again.",
        },
        fa: {
          product: "محیط برنامه‌ریزی ساخت",
          title: "ورود",
          lead: "برای ورود به میزکار از حساب سازمانی خود استفاده کنید.",
          email: "ایمیل",
          password: "گذرواژه",
          submit: "ورود",
          working: "در حال ورود…",
          footer: "دسترسی فقط به پروژه‌هایی است که حساب شما عضو آن‌هاست.",
          failed: "ایمیل یا گذرواژه نادرست است.",
          throttled: "تلاش‌های بیش از حد. چند دقیقه بعد دوباره امتحان کنید.",
          invalid: "ایمیل و گذرواژه را وارد کنید.",
          network: "سرویس میزکار در دسترس نیست. دوباره تلاش کنید.",
        },
        de: {
          product: "Arbeitsbereich für Bauplanung",
          title: "Anmelden",
          lead: "Melden Sie sich mit Ihrem Organisationskonto an, um den Arbeitsbereich zu öffnen.",
          email: "E-Mail",
          password: "Passwort",
          submit: "Anmelden",
          working: "Anmeldung läuft…",
          footer: "Der Zugriff ist auf Projekte beschränkt, in denen Ihr Konto Mitglied ist.",
          failed: "E-Mail oder Passwort ist falsch.",
          throttled: "Zu viele Versuche. Warten Sie einige Minuten und versuchen Sie es erneut.",
          invalid: "Geben Sie E-Mail und Passwort ein.",
          network: "Der Arbeitsbereichsdienst ist nicht erreichbar. Versuchen Sie es erneut.",
        },
        zh: {
          product: "施工计划工作区",
          title: "登录",
          lead: "使用您的组织账户打开工作区。",
          email: "电子邮箱",
          password: "密码",
          submit: "登录",
          working: "正在登录…",
          footer: "访问仅限您的账户所属的项目。",
          failed: "邮箱或密码不正确。",
          throttled: "尝试次数过多。请等待几分钟后重试。",
          invalid: "请输入邮箱和密码。",
          network: "无法连接工作区服务，请重试。",
        },
        ar: {
          product: "مساحة عمل تخطيط الإنشاءات",
          title: "تسجيل الدخول",
          lead: "استخدم حساب مؤسستك لفتح مساحة العمل.",
          email: "البريد الإلكتروني",
          password: "كلمة المرور",
          submit: "تسجيل الدخول",
          working: "جارٍ تسجيل الدخول…",
          footer: "الوصول مقصور على المشاريع التي يعد حسابك عضوًا فيها.",
          failed: "البريد الإلكتروني أو كلمة المرور غير صحيحة.",
          throttled: "محاولات كثيرة جدًا. انتظر بضع دقائق ثم أعد المحاولة.",
          invalid: "أدخل بريدك الإلكتروني وكلمة المرور.",
          network: "خدمة مساحة العمل غير متاحة. أعد المحاولة.",
        },
        fr: {
          product: "Espace de travail de planification de construction",
          title: "Connexion",
          lead: "Utilisez votre compte d’organisation pour ouvrir l’espace de travail.",
          email: "E-mail",
          password: "Mot de passe",
          submit: "Se connecter",
          working: "Connexion…",
          footer: "L’accès est limité aux projets dont votre compte est membre.",
          failed: "L’e-mail ou le mot de passe est incorrect.",
          throttled: "Trop de tentatives. Attendez quelques minutes puis réessayez.",
          invalid: "Saisissez votre e-mail et votre mot de passe.",
          network: "Le service de l’espace de travail est injoignable. Réessayez.",
        },
        ja: {
          product: "建設計画ワークスペース",
          title: "サインイン",
          lead: "組織のアカウントでワークスペースを開きます。",
          email: "メールアドレス",
          password: "パスワード",
          submit: "サインイン",
          working: "サインインしています…",
          footer: "アクセスは、アカウントがメンバーであるプロジェクトに限られます。",
          failed: "メールアドレスまたはパスワードが正しくありません。",
          throttled: "試行回数が多すぎます。数分待ってから再度お試しください。",
          invalid: "メールアドレスとパスワードを入力してください。",
          network: "ワークスペースサービスに接続できません。もう一度お試しください。",
        },
        ko: {
          product: "건설 계획 작업 공간",
          title: "로그인",
          lead: "조직 계정으로 작업 공간을 여십시오.",
          email: "이메일",
          password: "비밀번호",
          submit: "로그인",
          working: "로그인 중…",
          footer: "접근은 계정이 구성원인 프로젝트로 제한됩니다.",
          failed: "이메일 또는 비밀번호가 올바르지 않습니다.",
          throttled: "시도가 너무 많습니다. 몇 분 후 다시 시도하십시오.",
          invalid: "이메일과 비밀번호를 입력하십시오.",
          network: "작업 공간 서비스에 연결할 수 없습니다. 다시 시도하십시오.",
        },
        ru: {
          product: "Рабочая область планирования строительства",
          title: "Вход",
          lead: "Используйте учётную запись организации, чтобы открыть рабочую область.",
          email: "Электронная почта",
          password: "Пароль",
          submit: "Войти",
          working: "Вход…",
          footer: "Доступ ограничен проектами, в которых ваша учётная запись является участником.",
          failed: "Неверная электронная почта или пароль.",
          throttled: "Слишком много попыток. Подождите несколько минут и повторите попытку.",
          invalid: "Введите электронную почту и пароль.",
          network: "Сервис рабочей области недоступен. Повторите попытку.",
        },
        tr: {
          product: "İnşaat planlama çalışma alanı",
          title: "Giriş yap",
          lead: "Çalışma alanını açmak için kuruluş hesabınızı kullanın.",
          email: "E-posta",
          password: "Parola",
          submit: "Giriş yap",
          working: "Giriş yapılıyor…",
          footer: "Erişim, hesabınızın üye olduğu projelerle sınırlıdır.",
          failed: "E-posta veya parola yanlış.",
          throttled: "Çok fazla deneme. Birkaç dakika bekleyip tekrar deneyin.",
          invalid: "E-postanızı ve parolanızı girin.",
          network: "Çalışma alanı hizmetine ulaşılamıyor. Tekrar deneyin.",
        },
      };

      const DIRECTION = { fa: "rtl", ar: "rtl" };
      const HTML_LANG = { en: "en", fa: "fa", de: "de", zh: "zh-CN", ar: "ar", fr: "fr", ja: "ja", ko: "ko", ru: "ru", tr: "tr-TR" };
      const SUPPORTED = Object.keys(COPY);
      const STORAGE_KEY = "cubi.login.locale";

      const params = new URLSearchParams(window.location.search);

      function normalize(raw) {
        const value = String(raw || "").trim().toLowerCase();
        if (!value) return "";
        if (value.startsWith("zh")) return "zh";
        if (value.startsWith("tr")) return "tr";
        if (value.startsWith("fa")) return "fa";
        const base = value.split("-")[0];
        return SUPPORTED.includes(base) ? base : "";
      }

      function storedLocale() {
        try {
          return localStorage.getItem(STORAGE_KEY) || "";
        } catch {
          return "";
        }
      }

      let locale =
        normalize(params.get("lang")) ||
        normalize(storedLocale()) ||
        normalize(navigator.language) ||
        "en";

      const nextParam = params.get("next") || "";
      const nextPath = nextParam.startsWith("/") && !nextParam.startsWith("//") && !nextParam.includes("\\")
        ? nextParam
        : "/workbench/";

      const form = document.getElementById("cp-login-form");
      const errorBox = document.getElementById("cp-login-error");
      const submit = document.getElementById("cp-login-submit");
      const localeSelect = document.getElementById("cp-login-locale");

      function applyLocale() {
        const copy = COPY[locale];
        document.documentElement.lang = HTML_LANG[locale] || locale;
        document.documentElement.dir = DIRECTION[locale] || "ltr";
        document.title = `CUBI Workspace — ${copy.title}`;
        document.querySelectorAll("[data-i18n]").forEach((node) => {
          const key = node.getAttribute("data-i18n");
          if (key && copy[key]) node.textContent = copy[key];
        });
        if (localeSelect.value !== locale) localeSelect.value = locale;
      }

      function showError(message) {
        errorBox.textContent = message;
        errorBox.hidden = !message;
      }

      localeSelect.addEventListener("change", () => {
        const chosen = normalize(localeSelect.value);
        if (!chosen) return;
        locale = chosen;
        try {
          localStorage.setItem(STORAGE_KEY, locale);
        } catch {
          /* storage can be blocked; the language still applies for this view */
        }
        showError("");
        applyLocale();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = document.getElementById("cp-login-email").value.trim();
        const password = document.getElementById("cp-login-password").value;
        const copy = COPY[locale];
        if (!email || !password) {
          showError(copy.invalid);
          return;
        }
        showError("");
        submit.disabled = true;
        submit.textContent = copy.working;
        try {
          const response = await fetch("/api/session", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          if (response.ok) {
            window.location.assign(nextPath);
            return;
          }
          if (response.status === 429) showError(copy.throttled);
          else if (response.status === 401) showError(copy.failed);
          else if (response.status === 400) showError(copy.invalid);
          else showError(copy.network);
        } catch {
          showError(copy.network);
        } finally {
          submit.disabled = false;
          submit.textContent = COPY[locale].submit;
        }
      });

      applyLocale();
      document.getElementById("cp-login-email").focus();

      // A live session skips the form. A reauth=1 request keeps it visible.
      if (params.get("reauth") !== "1") {
        fetch("/api/session", { credentials: "same-origin" })
          .then((response) => {
            if (response.ok) window.location.replace(nextPath);
          })
          .catch(() => {});
      }
    </script>
  </body>
</html>
